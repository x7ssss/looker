[workspace]
members = [
    "crates/looker-protocol",
    "crates/looker-geo",
    "crates/looker-scraper",
    "crates/looker-pool",
    "crates/looker-gateway",
    "crates/looker-mega",
    "crates/looker-proxy",
    "crates/looker-down",
    "crates/looker-app",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
authors = ["x7sss"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/x7ssss/looker"
homepage = "https://github.com/x7ssss/looker"
description = "Native Rust proxy scraper, rotating local gateway, and multi-slot MEGA downloader"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
bytes = "1.7"
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
regex = "1.10"
ipnet = "2.9"
maxminddb = { version = "0.32", features = ["mmap"] }
memmap2 = "0.9"
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = "0.17"
socket2 = { version = "0.5", features = ["all"] }
parking_lot = "0.12"
rand = "0.8"
rust-embed = { version = "8.14", features = ["mime-guess"] }
mimalloc = { version = "0.1", default-features = false }
opener = "0.7"
tokio-util = { version = "0.7", features = ["rt"] }
dirs = "6"
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1.16"
webpki-roots = "1.0"

looker-protocol = { path = "crates/looker-protocol" }
looker-geo = { path = "crates/looker-geo" }
looker-scraper = { path = "crates/looker-scraper" }
looker-pool = { path = "crates/looker-pool" }
looker-gateway = { path = "crates/looker-gateway" }
looker-mega = { path = "crates/looker-mega" }

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
strip = true
