name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_ext: zip
            bin_ext: .exe
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz
            bin_ext: ''
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz
            bin_ext: ''
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            archive_ext: tar.gz
            bin_ext: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_ext: tar.gz
            bin_ext: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-rs (for Linux musl targets)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binaries (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p looker-proxy -p looker-down

      - name: Build release binaries (native cargo - Unix)
        if: "!matrix.use_cross && matrix.os != 'windows-latest'"
        run: cargo build --release --target ${{ matrix.target }} -p looker-proxy -p looker-down

      - name: Build release binaries (native cargo - Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install Tauri CLI (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Tauri NSIS installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd crates/looker-app
          cargo tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $TAG = "${{ github.ref_name }}"
          if ($TAG -eq "" -or $TAG.StartsWith("refs/")) { $TAG = "nightly" }
          $ARCHIVE_NAME = "looker-$TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$ARCHIVE_NAME" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/looker-proxy.exe" -Destination "dist/$ARCHIVE_NAME/"
          Copy-Item "target/${{ matrix.target }}/release/looker-down.exe" -Destination "dist/$ARCHIVE_NAME/"
          Copy-Item "README.md" -Destination "dist/$ARCHIVE_NAME/"
          Copy-Item "AGENT.md" -Destination "dist/$ARCHIVE_NAME/"
          Compress-Archive -Path "dist/$ARCHIVE_NAME" -DestinationPath "dist/$ARCHIVE_NAME.zip" -Force

          # Find and copy generated NSIS setup installer to dist/Looker-Setup-x64.exe
          $NSIS_SETUP = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/nsis/*setup*.exe", "target/release/bundle/nsis/*setup*.exe", "target/*/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($NSIS_SETUP) {
              Copy-Item $NSIS_SETUP.FullName -Destination "dist/Looker-Setup-x64.exe"
              Copy-Item $NSIS_SETUP.FullName -Destination "dist/Looker_x64-setup.exe"
              Write-Host "Successfully packaged NSIS installer: dist/Looker-Setup-x64.exe"
          } else {
              Write-Warning "No NSIS setup installer found in target bundle directory!"
          }

      - name: Package artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [[ "$TAG" == refs/* ]]; then TAG="nightly"; fi
          ARCHIVE_NAME="looker-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/looker-proxy" "dist/${ARCHIVE_NAME}/"
          cp "target/${{ matrix.target }}/release/looker-down" "dist/${ARCHIVE_NAME}/"
          cp "README.md" "dist/${ARCHIVE_NAME}/"
          cp "AGENT.md" "dist/${ARCHIVE_NAME}/"
          tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: looker-${{ matrix.target }}
          path: dist/*.*

  create-release:
    name: Create GitHub Release & Compute Checksums
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: Compute SHA-256 checksums
        run: |
          cd dist-all
          sha256sum *.* > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'tags/v')
        with:
          files: dist-all/*
          generate_release_notes: true
