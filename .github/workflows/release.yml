name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build - Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build standalone looker CLI binary
        shell: pwsh
        run: |
          cargo build --release -p looker-down --bin looker

      - name: Build Tauri NSIS installer
        shell: pwsh
        run: |
          cd crates/looker-app
          cargo tauri build --bundles nsis

      - name: Prepare Windows artifacts
        shell: pwsh
        run: |
          $NSIS = Get-ChildItem -Path "target/release/bundle/nsis/*-setup.exe", "target/release/bundle/nsis/*.exe", "crates/looker-app/target/release/bundle/nsis/*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($NSIS) {
            Copy-Item $NSIS.FullName -Destination "Looker-Setup-x64.exe"
            Write-Host "Found and prepared Looker-Setup-x64.exe from $($NSIS.FullName)"
          } else {
            Write-Error "NSIS setup executable not found in target/release/bundle/nsis!"
            exit 1
          }

          $CLI = Get-ChildItem -Path "target/release/looker.exe", "target/x86_64-pc-windows-msvc/release/looker.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($CLI) {
            Copy-Item $CLI.FullName -Destination "looker-windows-x64.exe"
            Write-Host "Found and prepared looker-windows-x64.exe from $($CLI.FullName)"
          } else {
            Write-Error "Standalone looker.exe binary not found in target/release!"
            exit 1
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: looker-windows
          path: |
            Looker-Setup-x64.exe
            looker-windows-x64.exe

  build-linux:
    name: Build - Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf zenity

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build standalone looker CLI binary
        run: cargo build --release -p looker-down --bin looker

      - name: Build Tauri Deb and AppImage
        run: |
          cd crates/looker-app
          APPIMAGE_EXTRACT_AND_RUN=1 cargo tauri build --bundles deb,appimage

      - name: Prepare Linux artifacts
        run: |
          APPIMAGE=$(find target/release/bundle/appimage crates/looker-app/target/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -n 1)
          DEB=$(find target/release/bundle/deb crates/looker-app/target/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1)
          CLI=$(find target/release target/x86_64-unknown-linux-gnu/release -maxdepth 1 -type f -name "looker" 2>/dev/null | head -n 1)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" Looker-Linux-x64.AppImage
            echo "Copied $APPIMAGE to Looker-Linux-x64.AppImage"
          else
            echo "Error: .AppImage bundle not found!" >&2
            exit 1
          fi
          if [ -n "$DEB" ]; then
            cp "$DEB" Looker-Linux-x64.deb
            echo "Copied $DEB to Looker-Linux-x64.deb"
          else
            echo "Error: .deb bundle not found!" >&2
            exit 1
          fi
          if [ -n "$CLI" ]; then
            cp "$CLI" looker-linux-x64
            chmod +x looker-linux-x64
            echo "Copied $CLI to looker-linux-x64"
          else
            echo "Error: standalone looker binary not found!" >&2
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: looker-linux
          path: |
            Looker-Linux-x64.AppImage
            Looker-Linux-x64.deb
            looker-linux-x64

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Verify release artifacts exist and are non-empty
        run: |
          cd release-artifacts
          for file in Looker-Setup-x64.exe Looker-Linux-x64.AppImage Looker-Linux-x64.deb looker-windows-x64.exe looker-linux-x64; do
            if [ ! -s "$file" ]; then
              echo "Error: $file does not exist or is empty!" >&2
              exit 1
            fi
            echo "Verified $file ($(stat -c%s "$file") bytes)"
          done

      - name: Compute SHA-256 checksums
        run: |
          cd release-artifacts
          sha256sum Looker-Setup-x64.exe Looker-Linux-x64.AppImage Looker-Linux-x64.deb looker-windows-x64.exe looker-linux-x64 > checksums.sha256
          cat checksums.sha256

      - name: Generate SLSA build provenance attestations
        uses: actions/attest@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          subject-path: |
            release-artifacts/Looker-*
            release-artifacts/looker-*

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release-artifacts/Looker-Setup-x64.exe
            release-artifacts/Looker-Linux-x64.AppImage
            release-artifacts/Looker-Linux-x64.deb
            release-artifacts/looker-windows-x64.exe
            release-artifacts/looker-linux-x64
            release-artifacts/checksums.sha256
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
