[package]
name = "looker-down"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native wire-speed downloader binary & headless CLI: parallel chunking through local gateway"

[lib]
name = "looker_down"
path = "src/lib.rs"

[[bin]]
name = "looker-down"
path = "src/main.rs"

[[bin]]
name = "looker"
path = "src/bin/looker.rs"

[dependencies]
tokio = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
indicatif = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
mimalloc = { workspace = true }
tokio-util = { workspace = true }
looker-mega = { workspace = true }
looker-gateway = { workspace = true }
looker-pool = { workspace = true }
looker-scraper = { workspace = true }
looker-geo = { workspace = true }
