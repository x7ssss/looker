[package]
name = "looker-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Local 127.0.0.1:8080 rotating proxy listener with pre-commit retries"

[dependencies]
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "process"] }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
socket2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rust-embed = { workspace = true }
tokio-util = { workspace = true }
looker-protocol = { workspace = true }
looker-pool = { workspace = true }
looker-mega = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
rfd = { workspace = true }
opener = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
